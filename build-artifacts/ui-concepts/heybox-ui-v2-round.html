<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>heybox Lite 圆屏预览</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #070708;
    }

    iframe {
      width: min(100vw, 100vh, 466px);
      height: min(100vw, 100vh, 466px);
      overflow: hidden;
      border: 0;
      border-radius: 50%;
      background: #0b0b0c;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .55);
    }
  </style>
</head>
<body>
  <iframe src="./heybox-ui-v2.html" title="heybox Lite 圆屏 UI"></iframe>
</body>
</html>
